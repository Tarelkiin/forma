<!doctype html><html lang="en"><meta charset="utf-8"><title>FORMA camera regression</title><style>body{background:#111;color:#eee;font:18px monospace;padding:30px}canvas{width:384px;height:256px;border:1px solid #777;image-rendering:pixelated}</style><h1>Camera compositing test</h1><p id="result">RUNNING</p><canvas id="preview" width="96" height="64"></canvas><script>const matteCanvas=document.createElement('canvas');function drawCameraFrame(ctx,frame,w,h){ctx.save();ctx.translate(w,0);ctx.scale(-1,1);ctx.drawImage(frame,(w-h*frame.width/frame.height)/2,0,h*frame.width/frame.height,h);ctx.restore();}
function composeSilhouette(c,frame,source,width,height){let matte=matteCanvas;if(matte.width!==width||matte.height!==height){matte.width=width;matte.height=height;}let mx=matte.getContext('2d');mx.setTransform(1,0,0,1,0,0);mx.globalCompositeOperation='source-over';mx.filter='none';mx.clearRect(0,0,matte.width,matte.height);mx.filter='blur(1.3px)';mx.drawImage(frame,0,0);mx.filter='none';c.globalCompositeOperation='source-over';c.clearRect(0,0,width,height);c.drawImage(source,0,0,width,height);c.globalCompositeOperation='destination-in';c.drawImage(matte,0,0);c.globalCompositeOperation='source-over';}

const W=96,H=64,source=document.createElement('canvas'),frame=document.createElement('canvas');source.width=frame.width=W;source.height=frame.height=H;let src=source.getContext('2d'),ctx=frame.getContext('2d',{willReadFrequently:true});src.fillStyle='red';src.fillRect(0,0,48,H);src.fillStyle='blue';src.fillRect(48,0,48,H);function mask(x){ctx.clearRect(0,0,W,H);ctx.fillStyle='white';ctx.fillRect(x,12,20,40);composeSilhouette(ctx,frame,source,W,H)}function assert(v,label){if(!v)throw Error(label)}try{mask(10);assert(ctx.getImageData(20,30,1,1).data[3]>240,'initial silhouette');mask(66);assert(ctx.getImageData(20,30,1,1).data[3]===0,'old silhouette must be cleared');assert(ctx.getImageData(76,30,1,1).data[3]>240,'new silhouette must remain');let edge=ctx.getImageData(66,30,1,1).data[3];assert(edge>0&&edge<255,'soft edge');let out=document.querySelector('#preview').getContext('2d');drawCameraFrame(out,frame,W,H);let mirrored=out.getImageData(20,30,1,1).data;assert(mirrored[2]>200&&mirrored[3]>240,'right blue silhouette mirrored to left');assert(out.getImageData(76,30,1,1).data[3]===0,'right cleared after mirror');document.querySelector('#result').textContent='PASS: moving mask clears history; soft edges; image and silhouette mirror together.'}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message;throw e}</script></html>
